# MySQL Database Configuration Profile (activate with --spring.profiles.active=mysql)
server.port=${SERVER_PORT:8084}
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never
